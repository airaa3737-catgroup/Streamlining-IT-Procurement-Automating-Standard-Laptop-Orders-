<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IT Procurement Automation</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
  <h1>💻 Streamlining IT Procurement</h1>
  <p>Automating Standard Laptop Orders with Flow Designer</p>
</div>
<div class="container">
  <div class="left">
    <h2>📝 New Laptop Request</h2>
    <form id="orderForm">
      <label>Employee Name</label>
      <input type="text" id="employeeName" required value="Arun Kumar">
      <label>Email</label>
      <input type="email" id="employeeEmail" required value="arun@company.com">
      <label>Department</label>
      <select id="department">
        <option value="IT">IT</option>
        <option value="HR">HR</option>
        <option value="Finance">Finance</option>
      </select>
      <label>Laptop</label>
      <select id="laptopId"></select>
      <div id="preview" class="preview"></div>
      <button type="submit">🚀 Submit (Trigger Flow)</button>
    </form>
  </div>
  <div class="right">
    <h2>⚙️ Flow Designer Log</h2>
    <div id="flowLog" class="flow-log">No orders yet. Submit to trigger flow.</div>
    <h2 style="margin-top:20px">📦 Recent Orders</h2>
    <div id="ordersList"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
